# Dr. Murat Irmak Kliniği — Dokploy (Docker Compose) üretim yığını.
#
# Dokploy bu compose dosyasını depodan derler, Environment sekmesinde tanımlanan
# değişkenleri enjekte eder ve kendi Traefik proxy'sini `web` servisine yönlendirir.
# Bilinçli olarak host portu yayınlanmaz: alan adını ve TLS'i Dokploy üstlenir.
# Dokploy dışında çalıştırmak için `web` altındaki `ports` bloğunu açın.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-drmurat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD tanimlayin}
      POSTGRES_DB: ${POSTGRES_DB:-drmurat}
    volumes:
      - db-data:/var/lib/postgresql/data
      # Buradaki dump'lar şu komutla geri yüklenir:
      #   docker compose exec -T db pg_restore -U drmurat -d drmurat --clean --if-exists < backups/<dosya>.dump
      - ./backups:/backups:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drmurat} -d ${POSTGRES_DB:-drmurat}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL tanimlayin}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-drmurat}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-drmurat}?schema=public}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET tanimlayin}
      # Yalnızca `npm run db:seed` tarafından okunur, çalışma zamanında kullanılmaz.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Randevu ve iletişim formlarının mail aktarımı.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      MAIL_TO: ${MAIL_TO:-}
      # Form oran sınırı; tanımsızsa sınır atlanır ve olay loglanır.
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      # Cloudflare R2 medya deposu. Tanımsızsa yüklemeler aşağıdaki volume'a yazılır.
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
    volumes:
      # R2 tanımlı değilken yüklenen dosyaların yeniden dağıtımda kaybolmaması için.
      - uploads:/app/public/uploads
    expose:
      - "3000"
    # ports:
    #   - "3300:3000"

volumes:
  db-data:
  uploads:
